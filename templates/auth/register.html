<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - CarTECH</title>
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1f2937;
        }
        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-align: center;
            color: #111827;
        }
        .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }
        /* Django'dan kelayotgan inputlarni chiroyli qilish */
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f9fafb;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .register-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .register-btn:hover {
            background: #059669;
        }
        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-top: 20px;
        }
        .footer-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .error-list {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            padding-left: 0;
            list-style: none;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2 class="title">CarTECH</h2>
    <p class="subtitle">Yangi hisob yaratish uchun ma'lumotlarni kiriting</p>

    <form method="post">
        {% csrf_token %}

        <!-- Formadagi har bir maydonni chiroyli qilib aylantirib chiqamiz -->
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="error-list">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="register-btn">Ro'yxatdan o'tish</button>
    </form>

    <div class="footer-text">
        Akkauntingiz bormi? <a href="{% url 'login' %}">Kirish</a>
    </div>
</div>

</body>
</html>
